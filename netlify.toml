[build]
  publish = "site"
  functions = "netlify/functions"
  command = "python3 src/build.py"

# Pas de post-traitement Netlify : il réécrivait les liens en URL sans .html,
# différentes des canoniques (pages « non canoniques » en double pour Google)
[build.processing]
  skip_processing = true
[build.processing.html]
  pretty_urls = false

[build.environment]
  RP_LIVE = "1"
  PYTHON_VERSION = "3.11"

[functions]
  node_bundler = "esbuild"
  included_files = []

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/equipe.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
